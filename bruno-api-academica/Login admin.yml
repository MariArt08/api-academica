info:
  name: Login admin
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/login"
  headers:
    - name: Accept
      value: application/json
  body:
    type: json
    data: |
      {
        "email": "admin@academica.test",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: bru.setEnvVar("token_admin", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
