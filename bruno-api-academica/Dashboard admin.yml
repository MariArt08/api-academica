info:
  name: Dashboard admin
  type: http
  seq: 10

http:
  method: GET
  url: "{{base_url}}/admin/dashboard"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{token_admin}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
